<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTEX - Hub di Cultura Operativa & Supply Chain Excellence</title>

    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            chtml: { displayAlign: 'center' }
        };
    </script>
    <script id="mathjax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-dark: #030814; --bg-card: #0A1326; --bg-card-hover: #11203E; --bg-accent: #0F1B33;
            --text-main: #E2E8F0; --text-muted: #94A3B8; --border-color: #1E293B; --border-gold: rgba(212, 175, 55, 0.35);
            --gold-main: #D4AF37; --gold-light: #FFE082; --gold-dark: #997A15;
            --correct-green: #10B981; --wrong-red: #EF4444; --info-blue: #38BDF8; --nav-height: 75px;
            --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        a { color: inherit; text-decoration: none; transition: all 0.3s ease; }
        ul { list-style: none; }

        header {
            background-color: rgba(3, 8, 20, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-gold);
            position: sticky; top: 0; z-index: 1000; padding: 0 5%; display: flex; justify-content: space-between;
            align-items: center; height: var(--nav-height); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .brand-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .nav-logo-img { width: 40px; height: 40px; display: block; }
        .brand-name { font-weight: 900; font-size: 1.4rem; letter-spacing: 2px; color: var(--gold-main); }
        .nav-links { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
        .nav-link { font-size: 0.92rem; font-weight: 600; color: var(--text-muted); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
        .nav-link:hover, .nav-link.active { color: var(--gold-light); background: rgba(212, 175, 55, 0.08); }
        .nav-link:focus-visible, .brand-container:focus-visible, .feature-box:focus-visible,
        .quiz-option:focus-visible, button:focus-visible, .game-card:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }
        .header-right { display: flex; align-items: center; gap: 18px; }
        .lang-switch { display: flex; gap: 4px; font-size: 0.85rem; font-weight: 700; background: rgba(255,255,255,0.05); padding: 3px 6px; border-radius: 20px; border: 1px solid var(--border-color); }
        .lang-btn { cursor: pointer; padding: 3px 10px; border-radius: 14px; transition: 0.3s; opacity: 0.6; color: var(--text-main); }
        .lang-btn.active { opacity: 1; color: #030814; background: linear-gradient(135deg, #FFF8D6, #D4AF37); box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3); }
        .menu-toggle { display: none; font-size: 1.6rem; color: var(--gold-light); cursor: pointer; background: none; border: none; padding: 4px 8px; }
        .mobile-menu { position: fixed; top: var(--nav-height); left: 0; width: 100%; height: calc(100vh - var(--nav-height)); background-color: rgba(8, 17, 32, 0.98); border-top: 1px solid var(--border-gold); display: none; flex-direction: column; padding: 20px 0; z-index: 999; overflow-y: auto; }
        .mobile-menu.open { display: flex; }
        .mobile-menu a { display: block; padding: 16px 30px; color: var(--text-main); font-weight: 600; font-size: 1.05rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .mobile-menu a:hover { color: var(--gold-light); background-color: var(--bg-card-hover); }
        @media (max-width: 1050px) { .nav-links { display: none; } .menu-toggle { display: block; } }

        .hero { position: relative; text-align: center; padding: 90px 20px 70px; background: radial-gradient(circle at 50% 30%, #0F203D 0%, #030814 70%); border-bottom: 1px solid var(--border-gold); overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); opacity: 0.8; }
        .hero-content { position: relative; z-index: 2; max-width: 920px; margin: 0 auto; }
        .hero-logo-container { margin-bottom: 24px; display: inline-block; width: 100%; max-width: 620px; }
        .hero-logo-img { width: 100%; height: auto; display: block; margin: 0 auto; }
        .hero-tagline { font-size: 1.15rem; font-weight: 800; color: var(--gold-light); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 25px; text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3); }
        .hero-proposito { font-size: 1.15rem; color: #CBD5E1; line-height: 1.8; margin: 0 auto 35px; max-width: 800px; }
        .hero-proposito strong { color: var(--gold-light); font-weight: 600; }

        .btn-gold { display: inline-flex; align-items: center; gap: 10px; padding: 16px 36px; border-radius: 8px; font-weight: 800; background: linear-gradient(135deg, #FFF8D6 0%, #D4AF37 50%, #9A7410 100%); color: #030814; border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25); }
        .btn-gold:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.45); }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-outline { display: inline-flex; align-items: center; gap: 10px; padding: 15px 32px; border-radius: 8px; font-weight: 700; background: transparent; color: var(--gold-light); border: 2px solid var(--gold-main); cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
        .btn-outline:hover { background: rgba(212, 175, 55, 0.15); transform: translateY(-2px); }
        .btn-small { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-accent); color: var(--text-main); transition: all 0.25s ease; }
        .btn-small:hover { border-color: var(--gold-main); color: var(--gold-light); }
        .btn-linkedin { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 6px; font-weight: 700; font-size: 0.82rem; cursor: pointer; border: 1px solid #0A66C2; background: rgba(10, 102, 194, 0.12); color: #6CB4EE; transition: all 0.25s ease; }
        .btn-linkedin:hover { background: #0A66C2; color: #fff; }
        .btn-sol { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 6px; font-weight: 700; font-size: 0.82rem; cursor: pointer; border: 1px solid var(--info-blue); background: rgba(56,189,248,0.1); color: var(--info-blue); }
        .btn-sol:hover { background: var(--info-blue); color: #030814; }

        .container { max-width: 1180px; margin: 0 auto; padding: 50px 20px; }
        .section-title { font-size: 1.8rem; color: var(--gold-light); margin-bottom: 30px; border-left: 5px solid var(--gold-main); padding-left: 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-gold); border-radius: 12px; padding: 35px; margin-bottom: 40px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); transition: transform 0.3s ease, border-color 0.3s ease; }
        .card:hover { border-color: rgba(212, 175, 55, 0.6); }
        .app-section { display: none; }
        .app-section.active-section { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-top: 30px; }
        .feature-box { background: var(--bg-accent); border: 1px solid var(--border-color); border-radius: 10px; padding: 25px; transition: all 0.3s ease; }
        .feature-box:hover { transform: translateY(-5px); border-color: var(--gold-main); background: var(--bg-card-hover); }
        .feature-icon { font-size: 2.2rem; margin-bottom: 15px; display: inline-block; }
        .feature-title { font-size: 1.2rem; color: var(--gold-light); margin-bottom: 10px; font-weight: 700; }

        .tool-tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tool-tab { padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-accent); color: var(--text-muted); }
        .tool-tab.active { border-color: var(--gold-main); color: var(--gold-light); background: rgba(212,175,55,0.1); }
        .tool-pane { display: none; }
        .tool-pane.active { display: block; }

        .sim-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 850px) { .sim-container { grid-template-columns: 1fr; } }
        .sim-controls { background: rgba(3, 8, 20, 0.6); padding: 25px; border-radius: 10px; border: 1px solid var(--border-color); }
        .sim-input-group { margin-bottom: 20px; }
        .sim-input-group label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
        .sim-input-group input[type="range"] { width: 100%; accent-color: var(--gold-main); height: 6px; background: var(--border-color); border-radius: 3px; }
        .sim-input-group input[type="number"] { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #030814; color: var(--text-main); font-size: 1rem; }
        .sim-output { background: var(--bg-accent); border: 1px solid var(--border-gold); border-radius: 10px; padding: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .oee-score { font-size: 3.5rem; font-weight: 900; line-height: 1; margin: 15px 0; color: var(--gold-main); }
        .oee-metrics { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .metric-item { font-size: 0.85rem; color: var(--text-muted); }
        .metric-value { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-top: 4px; }

        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 10px; }
        .game-card { background: var(--bg-accent); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column; gap: 10px; }
        .game-card:hover { border-color: var(--gold-main); background: var(--bg-card-hover); transform: translateY(-3px); }
        .game-card-icon { font-size: 1.8rem; }
        .game-card-title { font-size: 1.02rem; font-weight: 700; color: var(--gold-light); }
        .game-card-desc { font-size: 0.82rem; color: var(--text-muted); flex-grow: 1; }
        .game-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 9px; border-radius: 20px; }
        .tag-sector { background: rgba(56, 189, 248, 0.15); color: var(--info-blue); }
        .tag-facile { background: rgba(16, 185, 129, 0.15); color: var(--correct-green); }
        .tag-media { background: rgba(212, 175, 55, 0.18); color: var(--gold-light); }
        .tag-difficile { background: rgba(239, 68, 68, 0.15); color: #FCA5A5; }

        .game-stage { display: none; }
        .game-stage.active { display: block; }
        .game-stage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        .game-stage-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .solution-panel { display: none; margin-top: 22px; padding: 20px; border-radius: 10px; background: rgba(56,189,248,0.06); border: 1px solid rgba(56,189,248,0.35); font-size: 0.9rem; }
        .solution-panel.open { display: block; }
        .solution-panel h4 { color: var(--info-blue); margin-bottom: 12px; font-size: 1rem; }
        .solution-panel ol, .solution-panel ul { padding-left: 20px; margin-bottom: 8px; }
        .solution-panel li { margin-bottom: 8px; }

        .quiz-card { background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: 12px; padding: 30px; }
        .quiz-question { font-size: 1.25rem; font-weight: 700; color: var(--gold-light); margin-bottom: 20px; }
        .quiz-options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .quiz-option { background: #030814; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px 20px; cursor: pointer; transition: all 0.25s ease; font-size: 0.98rem; display: flex; align-items: center; gap: 12px; }
        .quiz-option:hover { border-color: var(--gold-main); background: var(--bg-card-hover); }
        .quiz-option.selected { border-color: var(--gold-main); background: rgba(212, 175, 55, 0.12); }
        .quiz-option.correct { border-color: var(--correct-green); background: rgba(16, 185, 129, 0.15); color: #A7F3D0; }
        .quiz-option.incorrect { border-color: var(--wrong-red); background: rgba(239, 68, 68, 0.15); color: #FECACA; }
        .quiz-feedback { padding: 16px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; margin-top: 15px; display: none; }

        .name-entry-input { width: 100%; max-width: 320px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: #030814; color: var(--text-main); font-size: 1rem; margin: 0 auto 18px; display: block; text-align: center; }
        .name-entry-input:focus { outline: none; border-color: var(--gold-main); }

        .order-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .order-item { display: flex; align-items: center; gap: 14px; background: #030814; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 16px; }
        .order-item .order-num { font-weight: 900; color: var(--gold-light); min-width: 22px; }
        .order-item .order-text { flex-grow: 1; font-size: 0.95rem; }
        .order-item .order-arrows { display: flex; gap: 6px; }
        .order-item .order-arrows button { background: var(--bg-accent); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 0.9rem; }
        .order-item .order-arrows button:hover { border-color: var(--gold-main); color: var(--gold-light); }
        .order-item.correct-pos { border-color: var(--correct-green); }
        .order-item.wrong-pos { border-color: var(--wrong-red); }

        .match-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 20px; }
        @media (max-width: 700px) { .match-container { grid-template-columns: 1fr; } }
        .match-col-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; }
        .match-item { background: #030814; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; font-size: 0.92rem; transition: all 0.2s ease; }
        .match-item:hover { border-color: var(--gold-main); }
        .match-item.picked { border-color: var(--gold-main); background: rgba(212,175,55,0.12); }
        .match-item.matched { border-color: var(--correct-green); background: rgba(16,185,129,0.12); opacity: 0.6; cursor: default; }
        .match-item.wrong { border-color: var(--wrong-red); background: rgba(239,68,68,0.15); }

        .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        @media (max-width: 650px) { .memory-grid { grid-template-columns: repeat(2, 1fr); } }
        .memory-card { background: var(--bg-accent); border: 1px solid var(--border-color); border-radius: 8px; min-height: 90px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text-muted); }
        .memory-card.flipped { background: var(--bg-card-hover); color: var(--text-main); border-color: var(--gold-main); }
        .memory-card.matched { background: rgba(16,185,129,0.12); border-color: var(--correct-green); color: #A7F3D0; cursor: default; }

        .tf-statement { font-size: 1.05rem; font-weight: 600; color: var(--text-main); margin-bottom: 20px; }
        .tf-buttons { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .tf-buttons button { min-width: 130px; padding: 14px 20px; font-size: 1rem; }

        .scenario-box { background: var(--bg-accent); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; margin-bottom: 20px; font-size: 0.95rem; color: var(--text-main); }
        .scenario-options { display: flex; flex-direction: column; gap: 12px; }

        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem; }
        .leaderboard-table th, .leaderboard-table td { padding: 14px 18px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .leaderboard-table th { color: var(--gold-light); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; background: rgba(0,0,0,0.3); }

        .divulgazione-tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .cadence-note { font-size: 0.82rem; color: var(--text-muted); background: rgba(212,175,55,0.05); border-left: 3px solid var(--gold-main); padding: 10px 14px; border-radius: 0 6px 6px 0; margin-bottom: 25px; }
        .post-card { background: var(--bg-accent); border: 1px solid var(--border-color); border-radius: 10px; padding: 22px; margin-bottom: 18px; }
        .post-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
        .post-icon-badge { width: 44px; height: 44px; min-width: 44px; border-radius: 10px; background: rgba(212,175,55,0.12); border: 1px solid var(--border-gold); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .post-date { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .post-title { font-size: 1.1rem; font-weight: 700; color: var(--gold-light); }
        .post-excerpt { font-size: 0.92rem; color: var(--text-main); margin-bottom: 14px; }
        .post-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .case-tagline { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--info-blue); margin-bottom: 4px; }
        .case-block { margin-bottom: 10px; font-size: 0.9rem; }
        .case-block strong { color: var(--gold-light); }

        .mini-chart { margin: 14px 0 18px; }
        .mini-chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.78rem; color: var(--text-muted); }
        .mini-chart-label { min-width: 170px; }
        .mini-chart-track { flex-grow: 1; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; height: 16px; }
        .mini-chart-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold-dark), var(--gold-main)); display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 0.68rem; font-weight: 700; color: #030814; }

        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; margin-top: 10px; }
        .team-card { background: var(--bg-accent); border: 1px solid var(--border-color); border-radius: 10px; padding: 22px; text-align: center; }
        .team-avatar { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800; color: #030814; background: linear-gradient(135deg, #FFF8D6, #D4AF37, #997A15); }
        .team-name { font-weight: 700; color: var(--gold-light); font-size: 1.05rem; margin-bottom: 4px; }
        .team-role { font-size: 0.8rem; color: var(--info-blue); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .team-bio { font-size: 0.85rem; color: var(--text-muted); }
        .team-card.founder { border-color: var(--gold-main); background: var(--bg-card-hover); }

        .legal-content { color: #CBD5E1; font-size: 0.95rem; line-height: 1.75; }
        .legal-content h3 { color: var(--gold-light); margin: 24px 0 10px; font-size: 1.15rem; }
        .legal-content p, .legal-content ul { margin-bottom: 14px; }
        .legal-content ul { padding-left: 20px; list-style: disc; }
        .privacy-box { background: rgba(212, 175, 55, 0.05); border-left: 4px solid var(--gold-main); padding: 15px; margin: 20px 0; border-radius: 0 8px 8px 0; }

        footer { text-align: center; padding: 50px 20px 30px; border-top: 1px solid var(--border-gold); background: #010307; margin-top: 60px; }
        .footer-claim { font-size: 1.15rem; font-weight: 800; color: var(--gold-light); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; font-size: 0.88rem; color: var(--text-muted); flex-wrap: wrap; }
        .footer-links a:hover { color: var(--gold-light); }
        .footer-terms-callout { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--gold-light); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; margin-bottom: 20px; }
        .footer-terms-callout:hover { color: var(--gold-main); }
    </style>
</head>
