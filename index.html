<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTEX - Hub di Cultura Operativa & Supply Chain Excellence</title>

    <style>
        :root {
            --bg-dark: #030814;
            --border-gold: rgba(212, 175, 55, 0.35);
            --gold-light: #FFE082;
            --gold-main: #D4AF37;
            --text-main: #E2E8F0;
            --nav-height: 75px;
            --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- HEADER & NAVIGAZIONE --- */
        header {
            background-color: rgba(3, 8, 20, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--nav-height);
        }

        .brand-container {
            display: flex;
            align-items: center;
        }

        /* Logo V per Header */
        .nav-logo-img {
            height: 42px;
            width: auto;
            display: block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .lang-switch {
            display: flex;
            gap: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(255,255,255,0.05);
            padding: 3px 6px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lang-btn {
            cursor: pointer;
            padding: 3px 10px;
            border-radius: 14px;
            opacity: 0.6;
            color: var(--gold-light);
        }

        .lang-btn.active {
            opacity: 1;
            color: #030814;
            background: linear-gradient(135deg, #FFF8D6, #D4AF37);
        }

        .menu-toggle, .search-toggle {
            font-size: 1.6rem;
            color: var(--gold-light);
            background: none;
            border: none;
            cursor: pointer;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            text-align: center;
            padding: 80px 20px 60px;
            background: radial-gradient(circle at 50% 30%, #0F203D 0%, #030814 70%);
            border-bottom: 1px solid var(--border-gold);
        }

        .hero-content {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo V Principale PNG */
        .hero-logo-img {
            width: 130px;
            height: auto;
            margin-bottom: 25px;
            display: block;
        }

        .hero-tagline {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--gold-light);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            max-width: 800px;
        }

        .hero-proposito {
            font-size: 1.1rem;
            color: var(--gold-light);
            line-height: 1.8;
            margin: 0 auto 35px;
            max-width: 800px;
        }

        .hero-proposito strong {
            color: #FFFFFF;
            font-weight: 700;
        }

        /* --- PULSANTI --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .btn-gold {
            width: 100%;
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF8D6 0%, #D4AF37 50%, #9A7410 100%);
            color: #030814;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        .btn-outline {
            width: 100%;
            padding: 15px 24px;
            border-radius: 8px;
            font-weight: 700;
            background: transparent;
            color: var(--gold-light);
            border: 2px solid var(--gold-main);
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- NAVIGAZIONE -->
    <header>
        <div class="brand-container">
            <a href="#">
                <img src="assets/vertex-logo-nav.png" alt="VERTEX Logo" class="nav-logo-img">
            </a>
        </div>

        <div class="header-right">
            <div class="lang-switch">
                <span class="lang-btn active">IT</span>
                <span class="lang-btn">ENG</span>
            </div>
            <button class="menu-toggle">☰</button>
            <button class="search-toggle">🔍</button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-content">
            <!-- Logo PNG centrale esente da filtri -->
            <img src="assets/vertex-logo-hero.png" alt="VERTEX" class="hero-logo-img">

            <div class="hero-tagline">Hub di Cultura Operativa & Supply Chain Excellence</div>
            
            <p class="hero-proposito">
                Un <strong>osservatorio indipendente</strong> dedicato all'analisi dei flussi industriali nelle PMI. Connettiamo esperienza di campo e visione strategica: integrando <strong>Supply Chain, Operations, Lean Improvement e Sistemi ERP/MRP</strong>.
            </p>

            <div class="btn-container">
                <button class="btn-gold">📈 Calcola OEE Industriale</button>
                <button class="btn-outline">🎮 Challenge Strategiche</button>
            </div>
        </div>
    </section>

</body>
</html>
