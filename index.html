<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VORTEX - Custom Laser Cutting</title>
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --gold-primary: #D4AF37;
      --gold-light: #FFE082;
      --gold-dark: #9A7410;
      --text-muted: #a0a5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* HEADER / NAV */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(10, 11, 14, 0.9);
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .v-icon-svg {
      width: 38px;
      height: 38px;
      display: block;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .lang-switch {
      display: flex;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .lang-btn.active {
      color: #ffffff;
      background: rgba(212, 175, 55, 0.2);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background-color: var(--gold-primary);
    }

    /* HERO SECTION */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
      background: radial-gradient(circle at center, #161922 0%, #0a0b0e 70%);
    }

    .hero-logo-svg {
      width: 100%;
      max-width: 650px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.2));
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="#" aria-label="Vortex Home">
      <svg class="v-icon-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldNavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF8D6"/>
            <stop offset="22%" stop-color="#FFE082"/>
            <stop offset="50%" stop-color="#D4AF37"/>
            <stop offset="78%" stop-color="#FDF0A6"/>
            <stop offset="100%" stop-color="#9A7410"/>
          </linearGradient>

          <mask id="vNavCut">
            <rect x="0" y="0" width="100" height="100" fill="#FFFFFF"/>
            <rect x="0" y="22" width="45" height="4" fill="#000000"/>
          </mask>
        </defs>

        <path mask="url(#vNavCut)" fill="url(#goldNavGrad)" d="M 10 10 L 32 10 L 50 90 L 68 10 L 90 10 L 50 90 Z"/>
      </svg>
    </a>

    <div class="nav-controls">
      <div class="lang-switch">
        <button class="lang-btn active">🇮🇹 IT</button>
        <span style="color: var(--text-muted);">|</span>
        <button class="lang-btn">🇬🇧 EN</button>
      </div>

      <button class="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <svg class="hero-logo-svg" viewBox="0 0 560 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradiente Oro Sincronizzato -->
        <linearGradient id="goldLuxeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF8D6"/>
          <stop offset="22%" stop-color="#FFE082"/>
          <stop offset="50%" stop-color="#D4AF37"/>
          <stop offset="78%" stop-color="#FDF0A6"/>
          <stop offset="100%" stop-color="#9A7410"/>
        </linearGradient>

        <!-- Taglio orizzontale trasparente (4px) sull'asta sinistra della V -->
        <mask id="vLeftStemCut">
          <rect x="0" y="0" width="560" height="100" fill="#FFFFFF"/>
          <rect x="0" y="22" width="45" height="4" fill="#000000"/>
        </mask>
      </defs>

      <g fill="url(#goldLuxeGrad)">
        <!-- V (Con taglio orizzontale sull'asta sinistra) -->
        <path mask="url(#vLeftStemCut)" d="M 10 10 L 32 10 L 50 90 L 68 10 L 90 10 L 50 90 Z"/>

        <!-- O -->
        <path d="M 148 10 C 122 10 106 28 106 50 C 106 72 122 90 148 90 C 174 90 190 72 190 50 C 190 28 174 10 148 10 Z M 148 27 C 160 27 167 36 167 50 C 167 64 160 73 148 73 C 136 73 129 64 129 50 C 129 36 136 27 148 27 Z"/>

        <!-- R -->
        <path d="M 208 10 L 250 10 C 270 10 282 20 282 34 C 282 46 272 54 256 56 L 285 90 L 259 90 L 233 58 L 230 58 L 230 90 L 208 90 Z M 230 25 L 230 43 L 246 43 C 256 43 260 38 260 34 C 260 29 256 25 246 25 Z"/>

        <!-- T -->
        <polygon points="298,10 362,10 362,26 341,26 341,90 319,90 319,26 298,26"/>

        <!-- E -->
        <polygon points="378,10 436,10 436,26 400,26 400,42 428,42 428,58 400,58 400,74 436,74 436,90 378,90"/>

        <!-- X (In Oro Luxe Pieno) -->
        <polygon points="450,10 474,10 497,46 520,10 544,10 509,50 546,90 522,90 497,54 472,90 448,90 485,50"/>
      </g>
    </svg>
  </section>

  <script>
    // Gestione selettore lingua
    const langBtns = document.querySelectorAll('.lang-btn');
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
